[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capslock-bro"
version = "0.1.0"
description = "Tray indicator for Caps Lock, with a live switch for what the Caps key does"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["capslock", "ctrl", "xkb", "kde", "plasma", "tray", "keyboard"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
]
dependencies = ["PySide6>=6.4"]

[project.scripts]
capslock-bro = "capslock_bro.__main__:main"

[project.urls]
Homepage = "https://github.com/SleepyZip/capslock-bro"
Issues = "https://github.com/SleepyZip/capslock-bro/issues"

[tool.hatch.build.targets.wheel]
packages = ["capslock_bro"]
